<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <!-- スマートフォンでも画面いっぱいに表示するための設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>わにゃぴが褒めるよ</title>

    <!-- CSSを読み込む -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- サイトのタイトル -->
        <header>
            <div class="icon">🐼</div>

            <h1>わにゃぴが<br>褒めるよ</h1>

            <p class="subtitle">
                今日のこと、わにゃぴに報告してね
            </p>
        </header>


        <!-- 報告を書く場所 -->
        <section class="report-section">

            <label for="report">
                今日なにがあった？
            </label>

            <textarea
                id="report"
                placeholder="今日あったことを書いてみてね"
            ></textarea>

        </section>


        <!-- 判定ボタン -->
        <section class="buttons">

            <button id="goodButton" class="good-button">
                🌸 いいこと！
            </button>

            <button id="badButton" class="bad-button">
                🌀 うーん……
            </button>

        </section>


        <!-- 結果を表示する場所 -->
        <section id="result" class="result hidden">

            <div id="resultIcon" class="result-icon">
                ✨
            </div>

            <p id="resultMessage">
                ここに結果が表示されます
            </p>

            <button id="resetButton" class="reset-button">
                もう一度報告する
            </button>

        </section>


        <!-- 注意書き -->
        <footer>
            このサイトでは報告内容を保存していません。
        </footer>

    </main>


    <!-- JavaScriptを読み込む -->
    <script src="script.js"></script>

</body>

</html>
